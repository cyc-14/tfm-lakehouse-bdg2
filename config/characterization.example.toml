# H03.2: local original sources; results must remain outside Git.
[paths]
raw_root = "../data/raw/bdg2"
output_root = "../data/checks/h03_2"
lakehouse_root = "../data/lakehouse"

[dataset]
kind = "real"
reference = "BDG2 v1.0; https://doi.org/10.5281/zenodo.3887306"
unit = "kWh per hourly record"
unit_reference = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7591488/#Sec14"

[sources]
metadata = "data/metadata/metadata.csv"
electricity = "data/meters/raw/electricity.csv"

[expected_sha256]
metadata = "992d0b29f24f96ad4332bc4dbb534b7bdd7dd2689aad093f94e93068ecddca02"
electricity = "039d909d8981e2d69eaeb366144e6ab7e84fa5e7e216aee42bddd95384a66418"

[analysis]
primary_usage = "Lodging/residential"
min_sqm = 3000
max_sqm = 7000
thresholds = [5, 8, 10]
missing_tokens = ["", "NaN"]
timestamp_format = "%Y-%m-%d %H:%M:%S"
iqr_multiplier = 1.5
max_grid_slots = 1000000

